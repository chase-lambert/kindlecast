[package]
name = "rustypub"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
dom_query = "0.28"
dom_smoothie = "0.18"
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
# Tilde, not caret: the image address policy in `src/net.rs` uses
# `ureq::unversioned` (Resolver, Agent::with_parts), which is explicitly outside
# ureq's semver guarantee. `~3.3` takes 3.3.x patches but not 3.4, where that
# surface may move. An exact pin was declined — it would also block security
# patches.
ureq = "~3.3"
url = "2"

[dev-dependencies]
# EPUB is Deflate-zip only. `deflate` enables pure-Rust flate2 (zip does not
# re-export a slimmer public feature that pulls flate2 alone). Still avoids
# default AES/bzip2/xz/zstd/lzma native stacks.
zip = { version = "2", default-features = false, features = ["deflate"] }
